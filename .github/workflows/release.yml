name: Release APK

# Build a signed release APK and publish it to a GitHub Release whenever a
# version tag is pushed (e.g. `git tag v1.0.4 && git push origin v1.0.4`).
# The in-app updater queries this repo's `releases/latest` and installs the
# attached APK, so the tag name must match the app's versionName.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/yiren-${GITHUB_REF_NAME}.apk"

      # 用 runner 自带的 gh CLI 发布。曾用 softprops/action-gh-release@v2，
      # 2026-06 起其新版本对默认 GITHUB_TOKEN 报 401（v1.0.5 首发因此失败），
      # gh CLI 走 GH_TOKEN 稳定且少一个三方依赖。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "译人 $GITHUB_REF_NAME" \
            --generate-notes \
            "artifacts/yiren-${GITHUB_REF_NAME}.apk"
