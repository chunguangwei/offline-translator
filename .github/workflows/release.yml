name: Release APK

# Build a signed release APK and publish it to a GitHub Release whenever a
# version tag is pushed (e.g. `git tag v1.0.4 && git push origin v1.0.4`).
# The in-app updater queries this repo's `releases/latest` and installs the
# attached APK, so the tag name must match the app's versionName.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk \
             "artifacts/yiren-${GITHUB_REF_NAME}.apk"

      # 发布说明从 CHANGELOG.md 提取对应版本的"人话"内容（应用内更新弹窗直接展示，
      # 不能是 --generate-notes 那种 commit 链接堆）；没写就兜底一句话。
      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md \
            | sed -e '/^---$/d' -e 's/^### /◆ /' -e 's/\*\*//g' -e 's/^- /· /' \
            | awk 'NF || p; {p=NF}' > notes.md
          if [ ! -s notes.md ] || [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "修正一些 Bug，提升稳定性。" > notes.md
          fi
          echo "===== release notes ====="; cat notes.md

      # 用 runner 自带的 gh CLI 发布。曾用 softprops/action-gh-release@v2，
      # 2026-06 起其新版本对默认 GITHUB_TOKEN 报 401（v1.0.5 首发因此失败），
      # gh CLI 走 GH_TOKEN 稳定且少一个三方依赖。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "译人 $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "artifacts/yiren-${GITHUB_REF_NAME}.apk"

      # 写应用内更新清单到 main：App 检查更新读它（gh-proxy/jsDelivr/raw 多源），
      # 不再依赖 api.github.com（未认证限流/部分网络 403）。
      - name: Update in-app update manifest (latest.json)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/yiren-${GITHUB_REF_NAME}.apk"
          SIZE=$(stat -c%s "artifacts/yiren-${GITHUB_REF_NAME}.apk")
          # APK 哈希写进清单：客户端下载后强校验，防经 gh-proxy/CDN 投毒或截断。
          SHA256=$(sha256sum "artifacts/yiren-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)
          # 工作区当前在 tag（detached）；切到最新 main 再提交，避免非快进推送被拒。
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p branding/update
          jq -n --arg v "$VERSION" --rawfile notes notes.md --arg apk "$APK_URL" --argjson size "$SIZE" --arg sha "$SHA256" \
            '{version:$v, notes:$notes, apk:$apk, size:$size, apkSha256:$sha}' > branding/update/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add branding/update/latest.json
          git commit -m "ci: 更新应用内更新清单 latest.json (${GITHUB_REF_NAME})"
          git push origin main
