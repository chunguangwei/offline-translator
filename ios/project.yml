# 译人 iOS — xcodegen 工程声明。
# 生成工程：`cd ios && xcodegen generate`（.xcodeproj 不入库，随手再生）。
name: Yiren
options:
  bundleIdPrefix: com.offlinetranslator
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "1"
    # 免费 Apple 账号：在 Xcode 的 Signing & Capabilities 里选 Personal Team 即可真机调试。
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # CLiteRTLM.xcframework 模拟器切片只有 arm64（无 x86_64），排除掉以免链接失败。
    # Apple Silicon Mac 的模拟器本就跑 arm64，无损。
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  Yiren:
    type: application
    platform: iOS
    sources:
      - path: Yiren
      - path: LiteRTLM/swift
        group: LiteRTLM
      # 开发期"模型随包"开关（ImagePilot add_bundled_model 同款思路）：
      # 把 .litertlm 放进 ios/BundledModels/ 即随 App 安装、装上即用，免真机下载。
      # 产品决策（2026-06-11）：正式分发不带模型，用户应用内自行下载——
      # 所以目录平时只有 .gitkeep（模型文件被 gitignore，目录必须存在否则构建失败）。
      - path: BundledModels
        type: folder
        buildPhase: resources
    # 4GB 内存设备（iPhone 13 等）加载 2.4G 模型需要提升内存上限，
    # 否则加载阶段会被 jetsam 杀掉。开发/正式签名均支持此公开 entitlement。
    entitlements:
      path: Yiren/Yiren.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    dependencies:
      # 动态库：必须 embed + 签名，否则运行时 dyld 找不到。
      - framework: LiteRTLM/CLiteRTLM.xcframework
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - YirenTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offlinetranslator.yiren
        INFOPLIST_KEY_CFBundleDisplayName: 译人
        # App 图标：Assets.xcassets/AppIcon（单尺寸 1024 全出血，从
        # branding/yiren-icon-master.svg 去圆角渲染，系统自己做遮罩）。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Yiren/Info.plist
      properties:
        CFBundleDisplayName: 译人
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 静态 LaunchScreen（App Store 要求）；品牌渐变启动视觉放 App 内（后续阶段）。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 语音输入需要使用麦克风，录音仅在本机离线转写为文字，不会上传。
        NSCameraUsageDescription: 拍照翻译需要使用相机，照片仅在本机离线识别翻译，不会上传。
        # 声明本地化 → 系统设置出现本 App 的 per-app 语言切换项；
        # 代码层 UI 文案经 PromptTemplates.isZhUi 跟随 preferredLanguages。
        CFBundleLocalizations:
          - zh-Hans
          - en
        CFBundleDevelopmentRegion: zh-Hans

  # 单元测试（纯逻辑：PromptTemplates / WAV / 版本比较 / 角色模板）。
  YirenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YirenTests
    dependencies:
      - target: Yiren
